<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>CodeOrigin — Evidence before attribution</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf2fa;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #283449;padding-bottom:20px}.brand{font-size:24px;font-weight:750;color:#76e5c3}h1{font-size:clamp(30px,5vw,52px);line-height:1.15;max-width:850px;margin:36px 0 16px}p{color:#aebed2}.badge{color:#76e5c3;font-size:13px;text-transform:uppercase;letter-spacing:.12em}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:28px}.panel{background:#121e30;border:1px solid #2a3b51;border-radius:16px;padding:24px}label{display:block;margin:12px 0 6px}select,button,input{font:inherit;max-width:100%}select{background:#1c2a40;color:#fff;padding:8px;border-radius:8px;border:1px solid #425570}textarea{width:100%;height:290px;resize:vertical;background:#090f1a;color:#dcf5ed;border:1px solid #425570;border-radius:10px;padding:14px;font:14px/1.6 monospace}button{cursor:pointer;border:0;border-radius:8px;background:#76e5c3;color:#09271d;padding:10px 18px;font-weight:650;margin:10px 8px 0 0}button.secondary{background:#26384f;color:#e4edf8}button:disabled{opacity:.4;cursor:default}h2{font-size:21px}#status{color:#ffce85}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a3b51}small{color:#aebed2}li{margin:12px 0}footer{margin:28px 0;color:#aebed2}input[type=file]{width:100%}:focus-visible{outline:3px solid #f5c16b;outline-offset:3px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:20px 14px}}
</style></head><body><main>
<header><span class="brand">⌘ CodeOrigin</span><select id="locale" aria-label="Interface language"><option value="en">English</option><option value="ko">한국어</option><option value="uz">O‘zbekcha</option></select></header>
<p class="badge" data-i="badge"></p><h1 data-i="heading"></h1><p data-i="intro"></p>
<div class="grid"><section class="panel"><h2 data-i="input"></h2><label for="language" data-i="language"></label><select id="language"><option value="python">Python</option><option value="javascript">JavaScript</option></select><label for="file" data-i="file"></label><input id="file" type="file" accept=".py,.js,.mjs,.cjs,.txt"><label for="source" data-i="paste"></label><textarea id="source" spellcheck="false" aria-describedby="privacy"></textarea><small id="privacy" data-i="privacy"></small><div><button id="analyze" data-i="analyze"></button><button class="secondary" id="sample" data-i="sample"></button><button class="secondary" id="clear" data-i="clear"></button></div><p id="status" role="status"></p></section>
<section class="panel" aria-live="polite"><h2 data-i="result"></h2><p id="verdict"></p><div id="metrics"></div><ul id="evidence"></ul><p data-i="limits"></p><button class="secondary" id="download" disabled data-i="download"></button></section></div><footer data-i="footer"></footer>
<script src="analyzer.js"></script><script src="app.js"></script></main></body></html>
